<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskBoard Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Elements for Premium Glassmorphism Look -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <header class="app-header glass-panel">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="7" height="7" rx="2" fill="#8B5CF6"/>
                <rect x="14" y="3" width="7" height="7" rx="2" fill="#8B5CF6" fill-opacity="0.5"/>
                <rect x="14" y="14" width="7" height="7" rx="2" fill="#8B5CF6" fill-opacity="0.5"/>
                <rect x="3" y="14" width="7" height="7" rx="2" fill="#8B5CF6" fill-opacity="0.5"/>
            </svg>
            TaskBoard Pro
        </div>
        <div class="stats">
            <div class="unassigned-badge" id="unassigned-badge">
                <span class="pulse-dot"></span>
                <span id="unassigned-count">0</span> Unassigned Tasks
            </div>
            <button id="create-task-btn" class="primary-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New Task
            </button>
        </div>
    </header>

    <main class="board">
        <div class="column" id="col-unassigned" data-status="unassigned">
            <div class="column-header">
                <h2>Unassigned</h2>
                <span class="count unassigned-count-pill">0</span>
            </div>
            <div class="task-list" id="list-unassigned"></div>
        </div>
        
        <div class="column" id="col-todo" data-status="todo">
            <div class="column-header">
                <h2>To Do</h2>
                <span class="count">0</span>
            </div>
            <div class="task-list" id="list-todo"></div>
        </div>
        
        <div class="column" id="col-inprogress" data-status="inprogress">
            <div class="column-header">
                <h2>In Progress</h2>
                <span class="count">0</span>
            </div>
            <div class="task-list" id="list-inprogress"></div>
        </div>
        
        <div class="column" id="col-done" data-status="done">
            <div class="column-header">
                <h2>Done</h2>
                <span class="count">0</span>
            </div>
            <div class="task-list" id="list-done"></div>
        </div>
    </main>

    <!-- Modal for Task Creation/Editing -->
    <div id="task-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel-heavy">
            <div class="modal-header">
                <h3 id="modal-title">Create New Task</h3>
                <button id="close-modal-btn" class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <input type="hidden" id="task-created-at">
                
                <div class="form-group">
                    <label for="task-title">Task Title *</label>
                    <input type="text" id="task-title" required placeholder="What needs to be done?">
                </div>
                
                <div class="form-group-row">
                    <div class="form-group">
                        <label for="task-creator">Created By *</label>
                        <input type="text" id="task-creator" required placeholder="Your name">
                    </div>
                    
                    <div class="form-group">
                        <label for="task-assignee">Assignee</label>
                        <input type="text" id="task-assignee" placeholder="Leave empty for Unassigned">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="task-status">Status</label>
                    <div class="custom-select">
                        <select id="task-status">
                            <option value="unassigned">Unassigned</option>
                            <option value="todo">To Do</option>
                            <option value="inprogress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" id="cancel-task-btn" class="secondary-btn">Cancel</button>
                    <button type="submit" class="primary-btn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
